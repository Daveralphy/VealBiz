<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The icon follows the browser's light or dark theme (SVG where supported, PNG pairs otherwise). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <title>WindVeal</title>
    <style>
      /* Start-up splash: shown before the app's code and styles arrive, then replaced by the page. */
      html, body { margin: 0; background: #f4f6fb; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #0c1430; }
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; animation: boot-in .4s ease both; }
      .boot img { width: 148px; height: auto; animation: boot-pulse 1.6s ease-in-out infinite; -webkit-user-drag: none; user-select: none; }
      .boot .boot-dark { display: none; }
      html[data-theme="dark"] .boot .boot-light { display: none; }
      html[data-theme="dark"] .boot .boot-dark { display: block; }
      .boot-bar { position: relative; width: 120px; height: 3px; border-radius: 3px; background: rgba(72, 111, 228, .15); overflow: hidden; }
      .boot-bar::before { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px; background: #486fe4; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-in { from { opacity: 0; } }
      @keyframes boot-pulse { 50% { opacity: .55; } }
      @keyframes boot-slide { from { left: -40%; } to { left: 100%; } }
      @media (prefers-reduced-motion: reduce) { .boot, .boot img, .boot-bar::before { animation: none; } }
    </style>
    <script>
      // Apply the saved theme before anything is drawn (no flash of the wrong colours).
      try { var t = localStorage.getItem("wv-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading WindVeal">
        <img class="boot-light" src="/logo.png" alt="" /><img class="boot-dark" src="/logo-light.png" alt="" />
        <span class="boot-bar"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
